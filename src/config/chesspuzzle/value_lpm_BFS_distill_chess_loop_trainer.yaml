agent_loops:
  search_agent:
    _target: src.agent_loop.game_value_lpm_loop

tokenizer_chat_template_path: resources/models/qwen2

data:
  agent_name: game_value_lpm_agent
  tokenizer: null
  use_shm: False
  train_files: ~/datasets/chess/train.parquet
  val_files: ~/datasets/chess/test.parquet
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 2048                # max length of prompts in the datasets
  max_response_length: 1024
  train_batch_size: 1024
  val_batch_size: null
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
  return_full_prompt: False
  shuffle: True
  filter_overlong_prompts: False # for large-scale dataset, filtering overlong prompts could be timeconsuming. You cat set the filter_overlong_prompts_workers to use multiprocessing to speed up.
  filter_overlong_prompts_workers: 1
  truncation: error
  image_key: images
  video_key: videos
  custom_cls:
      path: null
      name: null
  sampler:
    class_path: null
    class_name: null
  dataloader_num_workers: 0
  datagen:
    path: null
    name: null
  customized_prompt_set: null

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: ${oc.env:MODEL_PATH,null}
    use_shm: False
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: True
    enable_activation_offload: False
    use_remove_padding: False
    lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
    lora_alpha: 16  # LoRA scaling factor
    target_modules: all-linear  # all-linear or [q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj]
    use_liger: False
    use_fused_kernels: False
    trust_remote_code: False
    mask_logprob_before_KL: True    # mask logprob and ref_logprob before computing KL loss
    clip_all_logprob: True          # mask all logprob ever appears during training
    clip_all_logprob_min: -30
    clip_all_logprob_max: 0.
  actor:
    entropy_from_logits_with_chunking: False
    entropy_checkpointing: False
    strategy: fsdp  # [fsdp, fsdp2], This is for backward-compatibility
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
    ppo_micro_batch_size_per_gpu: null
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    # pg_losses2 = -advantages * torch.clamp(ratio, 1 - cliprange_low, 1 + cliprange_high)
    clip_ratio: 0.2 # default value if clip_ratio_low and clip_ratio_high are not specified
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0 # lower bound of the value for Dual-clip PPO from https://arxiv.org/pdf/1912.09729
    loss_agg_mode: "token-mean" # / "seq-mean-token-sum" / "seq-mean-token-mean"
    entropy_coeff: 0
    use_kl_loss: False # True for GRPO
    include_distillation_loss: False    # include distillation loss in the actor loss
    distillation_loss_coef: 0.1 # for distillation loss
    distillation_mode: "supervised-sd" # "supervised-sd" or "op-sd"
    distill_per_global_step: 1    # update per global step, if 1 then update everytime
    self_distillation:
      teacher_regularization: "ema"
      is_clip: null       # clip the ratio of distillation IS
      full_logit_distillation: False
      distillation_topk: 20
      distillation_add_tail: True
      alpha: 1.0  # 0 means reverse KL, 1.0 means forward KL
    use_torch_compile: True # False to disable torch compile
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    ppo_epochs: 1
    shuffle: False
    ulysses_sequence_parallel_size: 1 # sp size
    checkpoint:
      contents: ['model', 'optimizer', 'extra']  # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space
    optim:
      lr: 1e-6
      lr_warmup_steps: -1 # Prioritized. Negative values mean delegating to lr_warmup_steps_ratio.
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: 0.0   # only used with cosine lr scheduler, default to 0.0
      num_cycles: 0.5     # only used with cosine lr scheduler, default to 0.5
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
      weight_decay: 0.01
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      optimizer_offload: False
      offload_policy: False # only for fsdp2, offload param\grad\optimizer during train
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      fsdp_size: -1
    policy_loss:
      loss_mode: "vanilla"    # "vanilla" or "distillation"
      clip_cov_ratio: 0.0002
      clip_cov_lb: 1.0
      clip_cov_ub: 5.0
      kl_cov_ratio: 0.0002
      ppo_kl_coef: 0.1
    sft_loss:           # iterative RL+SFT training
      use_value_table: False
      value_table_url: "http://127.0.0.1:8081"
      value_table_retrieve_strategy: "random"
      value_table_max_values_per_state: 100
      offline_data_path: null     # if offline data paht is specified, will do sft on offline data
      enable: False     # whether to enable SFT training 
      warmup_steps: 10  # the number of steps of RL before starting SFT training
      sft_data_max_size: 2048 # the maximum number of samples in the SFT dataset
      sft_batch_size: 512   # the number of samples in each SFT batch
      use_remove_padding: ${actor_rollout_ref.model.use_remove_padding}         # following the model config
      ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size}         # following the actor config
      sft_micro_batch_size_per_gpu: 16      # number of samples on each GPU
      sft_max_token_len_per_gpu: 16384
      total_epochs: 5
      total_training_steps: null    # if not specified, total_epochs * len(train_dataloader) is the total steps
      grad_clip: 1.0
      data_dump_path: null         # if given, the collected online SFT data will be dumped to the path
      optim_cfg:
        lr: 1e-5
        betas: [ 0.9, 0.95 ]
        weight_decay: 0.01
        warmup_steps_ratio: 0.1
        clip_grad: 1.0
        warmup_style: cosine

  ref:
    entropy_from_logits_with_chunking: False
    strategy: fsdp
    fsdp_config:
      param_offload: False
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
    use_torch_compile: ${actor_rollout_ref.actor.use_torch_compile}
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: null
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size} # sp size
  rollout:
    save_batch_to_path: null
    load_batch_from_path: null
    # [Experimental] agent loop based rollout configs
    agent:
      agent_loop_config_path: src/config/chesspuzzle/lpm_loop_config.yaml
      # Number of agent loop workers
      num_workers: 32
      # custom async server configs
      custom_async_server:
        # Path to the custom async server implementation
        path: null
        # Class name of the custom async server class (e.g. AsyncvLLMServer)
        name: null
      auxiliary_agent_loop:
        enable: True
        num_workers: 32
        agent_loop_config_path: src/config/chesspuzzle/mdp_value_loop_config.yaml
        kwargs:
          agent_name: "game_value_infer_agent"
          prompt_set: tasks.classic_games.chess.prompt.QWEN_TWO_STAGE_VALUE_AUXILIARY_DIRECT_PROMPT_SET
    stop_words: []
    calculate_log_probs: False        # vllm raw log prob
    update_weights_bucket_megabytes: 512
    trace:
      backend: null
      token2text: False
    name: vllm
    mode: sync # sync: LLM, async: AsyncLLM
    chat_scheduler: null # async chat scheduler, e.g examples.ppo_trainer.naive_chat_scheduler.NaiveChatCompletionScheduler
    temperature: 1.0
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 1
    use_fire_sampling: False # https://arxiv.org/abs/2410.21236
    enable_search: False  # Whether to enable search
    search_url: "http://127.0.0.1:8000/retrieve"  # Search service URL
    search_topk: 3  # Maximum number of search results to return
    max_turns: 5  # Maximum number of interaction turns
    search_stop: "</search>"  # Search stop token
    max_concurrent_searches: 64   # 限制并发搜索请求数量
    max_concurrent_completions: 100  # 限制并发LLM请求数量
    searches_per_minute: 200  # 限制每分钟搜索请求数量 (速率控制)
    intermediate_instruction_prompt_set: ""   # for multi-turn instruction
    # State masking configuration
    state_masking: True  # Whether to enable state masking
    start_state_marker: "<execution_results>"  # Start marker for state masking
    end_state_marker: "</execution_results>"  # End marker for state masking
    prompt_length: ${data.max_prompt_length}      # use to define model len
    max_prompt_length: ${data.max_prompt_length}  # for mdp scheduler postprocess
    truncation: ${data.truncation}                # for mdp scheduler postprocess
    each_response_length: 256   # for each vllm rollout (in multi-turn setting)
    response_length: ${data.max_response_length}    # total response length (in multi-turn setting)
    special_response_length: 10240
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor  # safetensors (for huge model, and set use_shm=True); dummy_dtensor: randomly init model weight
    layered_summon: False # for huge model, layered summon can save memory (prevent OOM) but make it slower
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 16384
    max_model_len: null
    max_num_seqs: 1024
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: null
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: True
    enable_chunked_prefill: True # may get higher throughput when set to True. When activated, Please increase max_num_batched_tokens or decrease max_model_len.
    # for hf rollout
    do_sample: True
    # number of responses (i.e. num sample times)
    n: 1 # > 1 for grpo
    engine_kwargs: # inference engine parameters
      vllm:
        swap_space: null # null means "use the engine default value" (usually 4 GB), setting it to, e.g., 32 means 32 GB
      sglang:
        attention_backend: null # null means use the engine default value, available options: flashinfer, triton, flashmla
    val_kwargs:
      # sampling parameters for validation
      top_k: -1 # 0 for hf rollout, -1 for vllm rollout
      top_p: 1.0
      temperature: 0
      n: 1
      do_sample: False # default eager for validation
    multi_turn:
      ablation: null # "summary"
      plan_mode: "parallel"   # "sequential" or "parallel"
      ablation_stockfish_move: False    # in ablation mode, whether to use stockfish for move expansion
      max_window_size: 1  # Maximum number of turns to keep in context for vLLM server
      intermediate_instruction: true   # whether to add intermediate instruction for more process guidance
      random_move_when_invalid_plan_expansion: False   # whether to switch to random move when invalid plan move is detected at the first turn (expansion)
      include_random_expansion_in_response: True     # if random move is perform, switch the model action response with this random move
      random_move_when_invalid_plan_simulation: False   # whether to switch to random move when invalid plan move is detected at the second turn (simulation)
      include_random_simulation_in_response: True
      random_move_when_invalid_act: False   # whether to switch to random act when invalid act is detected
      include_random_act_in_response: True
      use_remote_inference_when_invalid_move: False   # whether to use remote inference when invalid move is detected
      remote_inference_prompt_type: "original"    # "original" or "separate"
      exploration_plan: 0   # whether to use exploration for planning phase
      full_exploration_in_simulation: False   # whether to use full exploration in simulation phase
      exploration_act: 0   # whether to use exploration for acting phase
      exploration_mode: "expert"      # "expert" or "random"
      include_turn2_simulation_in_response: True
      early_stop_answer: False   # whether to early stop when answer is detected during planning
      independent_summary: False  # if true, do summary independently,
      include_simulation_in_summary: False  # if true, include simulation history in summary
      completion_callback: null   #
      summary_response_length: ${actor_rollout_ref.rollout.each_response_length}
      final_reward_readjustment: False  # if true, the final env reward is adjust to position of last completion tokens
      enable: False  # should set rollout.name to sglang_async if True
      max_turns: null  # null for no limit (default max_length // 3)
      tool_config_path: null  # null for no tool
      format: hermes  # hermes, more formats will be supported in the future
      envs:
        env_config:
          env_name: ChessPuzzles
          game_mode: puzzles      # puzzle or full
          full_game_n: null
          use_stockfish: False    # whether to initialize stockfish engine
          stockfish_url: null    # required when use_stockfish is true or opponent_mode is stockfish
          opponent_mode: random
          max_steps: 10
          rating_range: [0,800]    # selecting difficulty of puzzles
          puzzle_scope: null     # getting the first 100 samples
          move_format: san
          board_format: fen
          stockfish_reward:
            enable: False             # use stockfish evaluator to give as reward in (external) env
            scaling_factor: 0.001
            use_as_planning_reward: False   # use as reward in internal planning env
            use_as_feedback: False          # also return state value as environment feedback
            use_as_planning_feedback: False   # return state value as each planning feedback
          rollout:
            n: ${actor_rollout_ref.rollout.n} # the group number of envs (for GRPO and GiGPO). -1 means disable env grouping.
            train_seed: [0, 10000]    # eval(train_seed)
            val_seed: [4096, 8192]
            train_val_ratio: 0.2
            conversation_prefix: "user"
            max_plan_traj_n: 3
            max_plan_horizon: 1
          prompt_set: tasks.classic_games.chess.prompt.QWEN_TWO_STAGE_VALUE_PARALLEL_PLAN_PROMPT_SET
          template_set: src.models.qwen2.tokenizer.QWEN25_TEMPLATE    # refresh model chat template, e.g. Qwen2.5's
          action_processor: tasks.classic_games.chess.processor.chess_extract_best_move
          max_legal_action_n: 30
          act_action_format_penality: 0.02
          plan_action_format_penality: 0.  # if 0, plan action format penalty is not used
          plan_action_reward_scale: 0.  # if 0, env reward during planning is not used
          act_reward_scale: 1.0       # acting phase reward scaling
          use_stockfish_move_matching_reward: False # whether to use stockfish move matching reward
          stockfish_move_matching_reward: 0.5
          stockfish_move_topk: 1    # the top k moves to match with the planned action
      post_process:
        tool_masking: True         # masking tool response
        assistant_loss_mask: null   # True if compute each assistant loss mask
        process_reward: null        # True if assign credit at the end of each assistant response
        truncation: "error"         #
        distillation_mode: ${actor_rollout_ref.actor.distillation_mode} # "supervised-sd" or "op-sd"
        sft:
          process_sft_dataset: ${actor_rollout_ref.actor.sft_loss.enable}   # if enable SFT training, process the SFT dataset
          sft_dataset_type: "supervised-sd" # "multiturn" or "singleturn" or "on-policy-distill", or "supervised-sd" or "op-sd"
          sft_prompt_set: tasks.classic_games.chess.prompt.QWEN_CHESS_SFT_PROMPT_SET
          sft_max_length: 2048
          training_cfg:
            ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.sft_loss.ulysses_sequence_parallel_size}
            total_training_steps: ${actor_rollout_ref.actor.sft_loss.total_training_steps}
            total_epochs: ${actor_rollout_ref.actor.sft_loss.total_epochs}
          use_value_table: ${actor_rollout_ref.actor.sft_loss.use_value_table}
          value_table_url: ${actor_rollout_ref.actor.sft_loss.value_table_url}
          value_table_retrieve_strategy: ${actor_rollout_ref.actor.sft_loss.value_table_retrieve_strategy}
          value_table_max_values_per_state: ${actor_rollout_ref.actor.sft_loss.value_table_max_values_per_state}
          value_table_exploration_p: 0.5
critic:
  rollout_n: ${actor_rollout_ref.rollout.n}
  strategy: fsdp # [fsdp, fsdp2]
  optim:
    lr: 1e-6
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
    weight_decay: 0.01
  model:
    path: ~/models/deepseek-llm-7b-chat
    use_shm: False
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: True
    enable_activation_offload: False
    use_remove_padding: False
    trust_remote_code: ${actor_rollout_ref.model.trust_remote_code}
    fsdp_config:
      param_offload: False
      optimizer_offload: False
      offload_policy: False # only for fsdp2, offload param\grad\optimizer during train
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
    lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
    lora_alpha: 16  # LoRA scaling factor
    target_modules: all-linear  # all-linear or [q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj]
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
  ppo_micro_batch_size_per_gpu: null
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  forward_micro_batch_size_per_gpu: ${critic.ppo_micro_batch_size_per_gpu}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768 # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5
  loss_agg_mode: ${actor_rollout_ref.actor.loss_agg_mode}
  checkpoint:
    contents: ['model', 'optimizer', 'extra']  # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space

reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    use_shm: False
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    use_fused_kernels: ${actor_rollout_ref.model.use_fused_kernels}
    trust_remote_code: False
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: False
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      fsdp_size: -1
  micro_batch_size: null # will be deprecated, use micro_batch_size_per_gpu
  micro_batch_size_per_gpu: null # set a number
  max_length: null
  ulysses_sequence_parallel_size: 1 # sp size
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
  reward_manager: mdp
  launch_reward_fn_async: False # custom reward function executed async on CPU, during log_prob
  sandbox_fusion:
    url: null # faas url to run code in cloud sandbox
    max_concurrent: 64 # max concurrent requests to sandbox

custom_reward_function:
  path: null
  name: compute_score

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  kl_penalty: kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1
  use_pf_ppo: False
  pf_ppo:
    reweight_method: pow  # ["pow", "max_min", "max_random"]
    weight_pow: 2.0

trainer:
  profile_steps: null
  balance_batch: True
  total_epochs: 30
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger: [ 'console', 'wandb' ]
  log_val_generations: 0
  rollout_data_dir: null # directory for logging the rollout data, no dump if null
  validation_data_dir: null # directory for logging the validation data, no dump if null
  nnodes: 1
  n_gpus_per_node: 1
  save_freq: -1
  # auto: find the last ckpt to resume. If can't find, start from scratch
  resume_mode: auto # or disable or resume_path if resume_from_path is set
  resume_from_path: null
  val_before_train: True
  test_freq: -1
  critic_warmup: 0
  default_hdfs_dir: null
  del_local_ckpt_after_load: False
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  # The timeout for ray worker group to wait for the register center to be ready
  ray_wait_register_center_timeout: 300
  device: cuda
  npu_profile:
    options:
      save_path: ./profiler_data
      level: level1
      with_memory: False
      record_shapes: False
      with_npu: True
      with_cpu: True
      with_module: False
      with_stack: False
      analysis: True
  esi_redundant_time: 0
ray_init:
  num_cpus: null # `None` means using all CPUs, which might cause hang if limited in systems like SLURM. Please set to a number allowed then.
